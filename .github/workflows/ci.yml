name: CI

on:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: arc-ci
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      # verification-receipts resolves `node` from absolute PATH entries; the
      # ARC runner image has bun but no Node. Pin it so the native runner tests
      # can spawn the same runtime the plugin targets (>= 22).
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "24"

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: "1.4.0"
          no-cache: true

      # AGENTS.md is gitignored (local-only). On hosted runners the
      # workspace-standard validator guard is planned out (no workspace tree
      # beside the checkout), so this empty placeholder is a local-parity
      # device for existence-checking consumers (the self-improve scratch copy
      # carries it over) rather than a CI-enforced contract. Never committed.
      - name: Create local-only AGENTS.md placeholder
        run: touch AGENTS.md

      - name: Generated-surface drift check (non-mutating)
        run: bun run build:check

      - name: Evidence path hygiene
        run: bun run evidence:check

      - name: Repository path hygiene
        run: bun run paths:check

      - name: Documentation link check
        run: bun run docs:check

      - name: Workflow safety check (pull-request lane and push CI)
        run: bun run policy:check

      - name: Build
        run: bun run build

      # `bun run build` rewrites the generated surfaces in the working tree, so
      # every later step — including the `--check` fixtures in
      # scripts/tests/checks.test.mjs — inspects a repaired tree. Assert the
      # build was a no-op over the committed files: a drifted commit then fails
      # here even if the pre-build `build:check` step is reordered or broken
      # (JJO-784: PR #6 renamed a shared constant without regenerating and no
      # step proved the committed artifacts still matched).
      - name: Build leaves the committed generated surfaces unchanged
        run: |
          set -eu
          if [ -n "$(git status --porcelain)" ]; then
            echo "build rewrote the committed tree; regenerate and commit the generated surfaces:"
            git status --porcelain
            exit 1
          fi
          echo "build left the committed tree unchanged"

      # The four smoke guards (verification-receipts x2, jev-advisor x2) install
      # and drive a local `gjc` binary that hosted runners do not have; the
      # real-gjc trial integration case and the ultragoal gate contract fixture
      # (scripts/tests/ultragoal-gate.test.mjs) likewise skip themselves when no
      # `gjc` binary is on PATH. The workspace-standard validator guard is planned only
      # where its local tree sits beside the repository (self-improve/lib/guards.mjs).
      # All boundaries are recorded in CONTRIBUTING.md, never silently passed.
      - name: Test (smoke guards skipped - require a local gjc binary)
        env:
          SELF_IMPROVE_SKIP_SMOKE: "1"
        run: bun run test

      - name: Keyless demo (temporary HOME)
        run: bun run demo

      # Failure forensics: the self-improve scratch guard writes per-guard logs
      # under /tmp and only reports the guard id on failure. Surface the tails
      # when the test step fails so a CI-only failure is diagnosable without a
      # local repro.
      - name: Failure forensics (self-improve scratch logs)
        if: failure()
        run: |
          for dir in /tmp/self-improve-integration-*; do
            [ -d "$dir" ] || continue
            echo "===== scratch: $dir ====="
            ls -la "$dir" "$dir/logs" 2>/dev/null || true
            for log in "$dir"/logs/*.log; do
              [ -f "$log" ] || continue
              echo "===== tail -n 150: $log ====="
              tail -n 150 "$log"
            done
          done
