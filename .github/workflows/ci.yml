name: CI

on:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.4.0"

      # AGENTS.md is gitignored (local-only). On hosted runners the
      # workspace-standard validator guard is planned out (no workspace tree
      # beside the checkout), so this empty placeholder is a local-parity
      # device for existence-checking consumers (the self-improve scratch copy
      # carries it over) rather than a CI-enforced contract. Never committed.
      - name: Create local-only AGENTS.md placeholder
        run: touch AGENTS.md

      - name: Generated-surface drift check (non-mutating)
        run: bun rrsi/scripts/build.mjs --check

      - name: Build
        run: bun run build

      # The four smoke guards (verification-receipts x2, jev-advisor x2) install
      # and drive a local `gjc` binary that hosted runners do not have; the
      # real-gjc trial integration case likewise skips itself when no `gjc`
      # binary is on PATH. The workspace-standard validator guard is planned only
      # where its local tree sits beside the repository (self-improve/lib/guards.mjs).
      # All boundaries are recorded in CONTRIBUTING.md, never silently passed.
      - name: Test (smoke guards skipped - require a local gjc binary)
        env:
          SELF_IMPROVE_SKIP_SMOKE: "1"
        run: bun run test

      # Failure forensics: the self-improve scratch guard writes per-guard logs
      # under /tmp and only reports the guard id on failure. Surface the tails
      # when the test step fails so a CI-only failure is diagnosable without a
      # local repro.
      - name: Failure forensics (self-improve scratch logs)
        if: failure()
        run: |
          for dir in /tmp/self-improve-integration-*; do
            [ -d "$dir" ] || continue
            echo "===== scratch: $dir ====="
            ls -la "$dir" "$dir/logs" 2>/dev/null || true
            for log in "$dir"/logs/*.log; do
              [ -f "$log" ] || continue
              echo "===== tail -n 150: $log ====="
              tail -n 150 "$log"
            done
          done
